<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsApp Webhook Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #e9edef;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .top-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 220px;
      background-color: #00a884;
      z-index: 1;
    }
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(11, 20, 26, 0.12);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      text-align: center;
    }
    .brand svg {
      width: 52px;
      height: 52px;
      fill: #25D366;
      margin-bottom: 12px;
    }
    .brand h1 {
      font-size: 22px;
      color: #111b21;
      font-weight: 600;
    }
    .brand p {
      font-size: 14px;
      color: #667781;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #3b4a54;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #d1d7db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }
    .btn-submit {
      width: 100%;
      background-color: #008069;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #00705b;
    }
    .alert-error {
      background-color: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .hint-box {
      margin-top: 24px;
      padding: 12px;
      background: #f0f2f5;
      border-radius: 6px;
      font-size: 12px;
      color: #54656f;
      line-height: 1.5;
    }
    .hint-box strong {
      color: #111b21;
    }
  </style>
</head>
<body>
  <div class="top-banner"></div>
  <div class="login-container">
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 24 24">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-5.46-4.45-9.92-9.91-9.92zM12.04 20.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31c-.82-1.31-1.26-2.83-1.26-4.38 0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.53-3.7 8.24-8.24 8.24zm4.52-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.66.3-.23.25-.88.86-.88 2.09s.9 2.43 1.03 2.6c.12.17 1.77 2.7 4.29 3.78.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.12-.23-.19-.48-.31z"/>
        </svg>
        <h1>WhatsApp Webhook</h1>
        <p>Masuk untuk melihat log pesan & payload</p>
      </div>

      <div id="error-alert" class="alert-error">
        Username atau password salah. Silakan coba lagi.
      </div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Masuk</button>
      </form>

      <div class="hint-box">
        💡 <strong>Kredensial Akun (Tersimpan di Database):</strong><br>
        Username: <code>admin</code><br>
        Password: <code>admin123</code><br>
        <em>(Akun disimpan secara terenkripsi scrypt di tabel <code>accounts</code>)</em>
      </div>
    </div>
  </div>

  <script>
    if (window.location.search.includes("error=1")) {
      document.getElementById("error-alert").style.display = "block";
    }
  </script>
</body>
</html>
